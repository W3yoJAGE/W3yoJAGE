name: Generate Snake

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate contribution snake
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: W3yoJAGE
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=5f3b93&color_dots=e6dcff,bba7ff,8c63c9,5f3b93,3f2a66
            dist/github-contribution-grid-snake-dark.svg?color_snake=fbfbff&color_dots=2a2550,3f3080,5f3b93,8c63c9,bba7ff

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
