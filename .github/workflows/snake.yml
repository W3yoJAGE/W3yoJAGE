name: Generate Snake

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate contribution snake
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: W3yoJAGE
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%235f3b93&color_dots=%23e6dcff,%23bba7ff,%238c63c9,%235f3b93,%233f2a66
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23fbfbff&color_dots=%232a2550,%233f3080,%235f3b93,%238c63c9,%23bba7ff

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
